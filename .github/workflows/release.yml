name: release

on:
  push:
    # release/v* picks up hand edits to an open release PR
    branches: [main, 'release/v*']
  pull_request:
    types: [closed]
    branches: [main]
  # merged release PRs, publish reruns, and prereleases all arrive here
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Cut a prerelease instead of a normal release, e.g. `alpha`, `beta` or `rc`'
        required: false
        default: ''
      npm-tag:
        description: 'npm dist-tag to publish to. Set by uppt/release for maintenance lines, leave blank otherwise'
        required: false
        default: ''

permissions: {}

jobs:
  # open or update a draft release PR from conventional commits
  pr:
    if: |
      github.repository == 'benjamincanac/nuxt-agent-discovery'
      && (
        (
          github.event_name == 'push'
          && (
            github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
            || startsWith(github.ref, 'refs/heads/release/v')
          )
        ) || (
          github.event_name == 'workflow_dispatch'
          && !startsWith(github.ref, 'refs/tags/')
        )
      )
    runs-on: ubuntu-latest
    # one updater at a time, so an older run can't finish last and overwrite the release branch
    concurrency:
      group: release-pr
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: danielroe/uppt/pr@2c9a289359311b9661cc99886a71121209b89d17 # v0.6.14
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ inputs.prerelease }}
          # same subject as past releases, and a valid conventional PR title
          title: 'chore(release): v{version}'

  # release PR merged: run the suite on the merge commit, nothing else gates it
  ci:
    if: |
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.head.ref, 'release/v')
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.repository == 'benjamincanac/nuxt-agent-discovery'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      preview: false
      # the squashed commit on main, which the release tags
      ref: ${{ github.event.pull_request.merge_commit_sha }}

  # then tag it, cut a GitHub release, dispatch the publish run
  release:
    needs: ci
    if: |
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.head.ref, 'release/v')
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.repository == 'benjamincanac/nuxt-agent-discovery'
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: danielroe/uppt/release@2c9a289359311b9661cc99886a71121209b89d17 # v0.6.14
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # the chained dispatch lands here on the vX.Y.Z tag, build the tarball
  pack:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: pack-${{ github.ref }}
      cancel-in-progress: false
    permissions: {}
    outputs:
      files: ${{ steps.pack.outputs.files }}
    steps:
      - id: pack
        uses: danielroe/uppt/pack@2c9a289359311b9661cc99886a71121209b89d17 # v0.6.14

  # stage the prebuilt tarball to npm via OIDC
  publish:
    if: |
      github.event_name == 'workflow_dispatch'
      && startsWith(github.ref, 'refs/tags/v')
      && needs.pack.outputs.files != '[]'
    needs: pack
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write
    environment: npm
    steps:
      - uses: danielroe/uppt/publish@2c9a289359311b9661cc99886a71121209b89d17 # v0.6.14
        with:
          files: ${{ needs.pack.outputs.files }}
          npm-tag: ${{ inputs.npm-tag }}
